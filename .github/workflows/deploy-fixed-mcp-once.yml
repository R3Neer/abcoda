name: Deploy validated MCP contract once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-fixed-mcp-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07032cd658105cd192472108ced56a07fe23a6c8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production artifacts
        run: npm run build:v2-worker
      - name: Verify production artifacts
        run: npm run verify:v2-artifacts
      - name: Deploy ABCoda to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/worker/wrangler.jsonc
      - name: Verify public MCP contract
        env:
          ABCODA_PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for attempt in 1 2 3; do
            npm run verify:v2-preview -- "$ABCODA_PREVIEW_URL" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload deployment validation
        uses: actions/upload-artifact@v4
        with:
          name: production-mcp-validation
          path: dist/v2-preview-validation.json
          if-no-files-found: error
