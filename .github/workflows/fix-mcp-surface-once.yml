name: Repair MCP surface once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mcp-surface-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the production MCP contract v2-only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              source = p.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(source.replace(old, new))

          # The public render_score schema must expose only the v2 snapshot contract.
          replace_once(
              "packages/contracts/src/index.ts",
              "export const renderScoreToolInputSchema = z.union([\n  presentScoreRequestSchema,\n  legacyRenderScoreRequestSchema,\n]);",
              "export const renderScoreToolInputSchema = presentScoreRequestSchema;",
          )

          # Keep legacy DTOs available internally for old fixtures, but remove the legacy branch
          # from the production MCP adapter.
          p = Path("apps/worker/src/mcp/create-server.ts")
          source = p.read_text()
          for line in [
              "  legacyRenderScoreRequestSchema,\n",
              "  type LegacyRenderScoreRequest,\n",
              "  type ScorePresentationDto,\n",
              "  type ScoreSnapshotDto,\n",
          ]:
              if line not in source:
                  raise SystemExit(f"create-server import missing: {line.strip()}")
              source = source.replace(line, "")
          helper_start = source.index("function legacyPresentation(")
          server_start = source.index("export function createV2McpServer(")
          source = source[:helper_start] + source[server_start:]
          handler_start = source.index("          const input = renderScoreToolInputSchema.parse(rawInput);")
          handler_end = source.index("        } catch (error) {", handler_start)
          handler = '''          const input = renderScoreToolInputSchema.parse(rawInput);\n          const internalResult = presentScore.execute({\n            score: fromScoreSnapshotDto(input.snapshot),\n          });\n          const result = toEvaluateScoreResultDto(internalResult);\n          const adapted = input.presentation !== undefined\n            ? { ...result, presentation: input.presentation }\n            : result;\n          return observation.complete(adapted.status, {\n            structuredContent: adapted,\n            content: [\n              {\n                type: "text" as const,\n                text: adapted.status === "success" && adapted.snapshot\n                  ? `Prepared revision ${adapted.snapshot.revision} for interactive presentation.`\n                  : "The score could not be presented because validation failed.",\n              },\n            ],\n          });\n'''
          source = source[:handler_start] + handler + source[handler_end:]
          p.write_text(source)

          # Unit-level contract regression test.
          replace_once(
              "tests/v2/contracts.test.ts",
              "  playbackProfileSchema,\n  scoreOperationSchema,",
              "  playbackProfileSchema,\n  renderScoreToolInputSchema,\n  scoreOperationSchema,",
          )
          replace_once(
              "tests/v2/contracts.test.ts",
              "  it(\"normalizes playback defaults at the external boundary\", () => {",
              '''  it("keeps render_score public input strictly on schema v2", () => {\n    expect(() => renderScoreToolInputSchema.parse({\n      schemaVersion: 1,\n      abc: "X:1\\nK:C\\nC|]",\n    })).toThrow();\n  });\n\n  it("normalizes playback defaults at the external boundary", () => {''',
          )

          # The real Worker boundary must reject legacy schema 1 calls.
          p = Path("tests/worker/http-boundary.test.ts")
          source = p.read_text()
          start = source.index("    const legacyPresentation = await rpcRequest({")
          end = source.index("    const resource = await rpcRequest({", start)
          replacement = '''    const legacyPresentation = await rpcRequest({\n      jsonrpc: "2.0",\n      id: 41,\n      method: "tools/call",\n      params: {\n        name: "render_score",\n        arguments: {\n          schemaVersion: 1,\n          abc: "X:8\\nT:Legacy input\\nM:4/4\\nL:1/4\\nK:C\\nC D E F|]",\n        },\n      },\n    });\n    expect(legacyPresentation.status).toBe(200);\n    await expect(legacyPresentation.json()).resolves.toMatchObject({\n      jsonrpc: "2.0",\n      id: 41,\n      result: { isError: true },\n    });\n\n'''
          source = source[:start] + replacement + source[end:]
          p.write_text(source)

          # Public deployment probe: exact tool set, stable discovery, and no v1 properties.
          p = Path("scripts/verify-v2-preview.mjs")
          source = p.read_text()
          old = '''const tools = await rpc("tools/list");\nconst toolList = tools.body.result?.tools;\nassert(Array.isArray(toolList), "tools/list omitted tools.");\nconst toolNames = new Set(toolList.map((tool) => tool.name));\nfor (const name of ["prepare_composition", "validate_score", "render_score"]) {\n  assert(toolNames.has(name), `tools/list omitted ${name}.`);\n}\nconst resourceUri = `ui://abcoda/score-schema-${health.schemaVersion}.html`;\nconst renderTool = toolList.find((tool) => tool.name === "render_score");\nassert(renderTool?._meta?.ui?.resourceUri === resourceUri, "render_score points at the wrong UI resource.");\nchecks.toolsList = "ok";'''
          new = '''const tools = await rpc("tools/list");\nconst toolList = tools.body.result?.tools;\nassert(Array.isArray(toolList), "tools/list omitted tools.");\nconst expectedToolNames = ["prepare_composition", "render_score", "validate_score"];\nconst actualToolNames = toolList.map((tool) => tool.name).sort();\nassert(\n  JSON.stringify(actualToolNames) === JSON.stringify(expectedToolNames),\n  `tools/list returned unexpected tools ${JSON.stringify(actualToolNames)}.`,\n);\nconst toolsAgain = await rpc("tools/list");\nassert(\n  JSON.stringify(toolsAgain.body.result?.tools) === JSON.stringify(toolList),\n  "Two consecutive tools/list calls returned different tool definitions.",\n);\nconst resourceUri = `ui://abcoda/score-schema-${health.schemaVersion}.html`;\nconst renderTool = toolList.find((tool) => tool.name === "render_score");\nassert(renderTool?._meta?.ui?.resourceUri === resourceUri, "render_score points at the wrong UI resource.");\nassert(renderTool?.inputSchema?.type === "object", "render_score must expose one object schema, not a union.");\nconst renderProperties = renderTool.inputSchema?.properties ?? {};\nassert("snapshot" in renderProperties, "render_score input omitted the v2 snapshot.");\nfor (const legacyProperty of ["abc", "composition", "playback", "notation", "display"]) {\n  assert(!(legacyProperty in renderProperties), `render_score still exposes legacy property ${legacyProperty}.`);\n}\nchecks.toolsList = "ok";'''
          if source.count(old) != 1:
              raise SystemExit("verify-v2-preview: tools/list block did not match exactly once")
          p.write_text(source.replace(old, new))

          # There must be exactly one production deployment path. The old root wrangler config
          # pointed at worker/index.ts but used the same Cloudflare Worker name `abcoda`.
          root_wrangler = Path("wrangler.jsonc")
          if not root_wrangler.exists():
              raise SystemExit("legacy root wrangler config was already missing")
          root_wrangler.unlink()

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["build"] = "npm run build:worker"
          scripts["build:widget"] = "npm run build:v2-widget"
          scripts["build:worker"] = "npm run build:v2-worker"
          scripts["dev"] = "npm run dev:v2-widget"
          scripts["dev:worker"] = "npm run build:v2-widget && wrangler dev --config apps/worker/wrangler.jsonc"
          scripts["deploy:worker"] = "wrangler deploy --config apps/worker/wrangler.jsonc"
          scripts.pop("deploy:v2-preview", None)
          scripts["typecheck"] = "npm run typecheck:v2"
          scripts["check"] = "npm run lint && npm run typecheck && npm test && npm run build:v2-widget && npm run test:v2-worker && npm run build:v2-worker && npm run verify:v2-artifacts"
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n")

          replace_once(
              ".github/workflows/ci.yml",
              "    branches: [main, architecture-v2]",
              "    branches: [main]",
          )

          deploy = Path(".github/workflows/deploy-preview.yml")
          text = deploy.read_text()
          text = text.replace("name: Deploy v2 preview", "name: Deploy ABCoda")
          text = text.replace("Build v2 artifacts", "Build production artifacts")
          text = text.replace("Verify v2 artifacts", "Verify production artifacts")
          text = text.replace("Deploy Cloudflare preview", "Deploy ABCoda to Cloudflare")
          text = text.replace("Verify public preview", "Verify public deployment")
          text = text.replace("Upload preview validation", "Upload deployment validation")
          deploy.write_text(text)
          PY
      - name: Verify repaired repository
        run: npm run check
      - name: Commit repair and remove this one-shot workflow
        run: |
          rm .github/workflows/fix-mcp-surface-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make production MCP surface v2-only"
          git push origin HEAD:main
