name: Deploy ABCoda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build production artifacts
        run: npm run build:v2-worker

      - name: Verify production artifacts
        run: npm run verify:v2-artifacts

      - name: Deploy ABCoda to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/worker/wrangler.jsonc

      - name: Verify public deployment
        env:
          ABCODA_PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run verify:v2-preview -- "$ABCODA_PREVIEW_URL"

      - name: Upload deployment validation
        uses: actions/upload-artifact@v4
        with:
          name: v2-preview-validation
          path: dist/v2-preview-validation.json
          if-no-files-found: error
