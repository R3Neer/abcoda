name: Patch OpenAI theme browser expectation

on:
  push:
    branches:
      - architecture-v2
    paths:
      - .github/workflows/patch-openai-theme-test.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-v2
      - name: Align pressed-control expectation with OpenAI primary solid token
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/widget-scenarios.e2e.ts')
          source = path.read_text()
          old = 'await expect(loop).toHaveCSS("background-color", "rgb(37, 99, 235)");'
          new = 'await expect(loop).toHaveCSS("background-color", "rgb(24, 24, 24)");'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy color assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/widget-scenarios.e2e.ts
          git commit -m "test: align pressed controls with OpenAI primary token"
          git push origin HEAD:architecture-v2
