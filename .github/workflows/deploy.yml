name: Deploy ABCoda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build production artifacts
        run: npm run build:worker

      - name: Verify production artifacts
        run: npm run verify:artifacts

      - name: Deploy ABCoda to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/worker/wrangler.jsonc

      - name: Verify public deployment
        env:
          ABCODA_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run verify:deployment -- "$ABCODA_DEPLOYMENT_URL"

      - name: Upload deployment validation
        uses: actions/upload-artifact@v4
        with:
          name: deployment-validation
          path: dist/deployment-validation.json
          if-no-files-found: error
