name: CI

on:
  push:
    branches: [main, architecture-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check types, tests, and builds
        run: npm run check
      - name: Run range browser smoke
        run: npx playwright test tests/browser/range-semantics.e2e.ts tests/browser/visual-review.e2e.ts --grep range --retries=0 --workers=1 --timeout=15000
      - name: Run browser tests
        run: npm run test:browser
      - name: Upload browser visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-review-${{ github.run_attempt }}
          path: test-results/**/visual-review/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
