name: CI

on:
  push:
    branches: [main, architecture-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - name: Upload browser visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-review-${{ github.run_attempt }}
          path: test-results/**/visual-review/*.png
          if-no-files-found: ignore
          retention-days: 7
