name: Retire migrated architecture branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire-branches:
    if: github.repository == 'R3Neer/abcoda'
    runs-on: ubuntu-latest
    steps:
      - name: Delete migrated branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/architecture-v2"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/noop"
