<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABCoda v2 widget laboratory</title>
  </head>
  <body>
    <main class="shell" aria-label="ABCoda score widget">
      <header class="header">
        <p id="score-title" class="eyebrow">ABCoda</p>
        <output id="status" class="status" aria-live="polite">Booting</output>
      </header>
      <section id="error" class="error" role="alert" hidden></section>
      <div class="workspace">
        <section id="score" class="score" aria-label="Music score"></section>
        <details id="mixer" class="mixer" aria-labelledby="mixer-title" hidden>
          <summary class="mixer-heading">
            <h2 id="mixer-title">Instruments</h2>
            <span>Per-voice playback</span>
          </summary>
          <div id="voice-mix" class="voice-mix"></div>
        </details>
      </div>
      <details id="editor" class="editor" hidden>
        <summary>
          <span>Edit ABC</span>
          <output id="editor-state">Saved</output>
        </summary>
        <div class="editor-body">
          <div class="editor-toolbar">
            <label for="abc-draft">ABC source</label>
            <details id="version-picker" class="version-picker">
              <summary aria-label="Version history" title="Version history">
                <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 1-8.45 5.91l-1.97-.02L6 5.5 9.42 8.9l-2.53.01A7 7 0 1 0 13 5v3l-4-4 4-4v3zm-1 5h2v5.17l3.24 1.87-1 1.73L12 14.32V8z" /></svg>
                <span>Versions</span>
              </summary>
              <div id="version-history" class="version-history" role="listbox" aria-label="Draft versions"></div>
            </details>
          </div>
          <div class="textarea-shell">
            <textarea id="abc-draft" rows="12" spellcheck="false"></textarea>
            <button id="copy-draft" class="icon-button copy-button" type="button" aria-label="Copy ABC" title="Copy ABC">
              <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7V3h11v13h-4v5H4V7h4zm2 0h5v7h2V5h-7v2zm3 2H6v10h7V9z" /></svg>
            </button>
            <output id="copy-status" class="copy-status" aria-live="polite"></output>
          </div>
          <ul id="draft-diagnostics" class="draft-diagnostics" aria-live="polite"></ul>
          <div class="transpose-controls" role="group" aria-label="Transpose draft">
            <span>Transpose draft</span>
            <button id="transpose-down-octave" type="button" data-semitones="-12">−12</button>
            <button id="transpose-down" type="button" data-semitones="-1">−1</button>
            <button id="transpose-up" type="button" data-semitones="1">+1</button>
            <button id="transpose-up-octave" type="button" data-semitones="12">+12</button>
          </div>
        </div>
      </details>
      <footer class="transport" aria-label="Playback controls">
        <button id="rewind" class="icon-button" type="button" disabled aria-label="Return to beginning" title="Return to beginning">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6V3L5 8l6 5v-3a6 6 0 1 1-5.65 8H3.26A8 8 0 1 0 11 6z" /></svg>
        </button>
        <button id="playback" class="icon-button" type="button" disabled aria-label="Play" title="Play">
          <svg class="control-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg class="control-icon pause-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
        </button>
        <button id="loop" class="icon-button" type="button" disabled aria-pressed="false" aria-label="Enable loop" title="Enable loop">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1l4 4-4 4V6H7a4 4 0 0 0-4 4v1H1v-1a6 6 0 0 1 6-6h10V1zm6 12v1a6 6 0 0 1-6 6H7v3l-4-4 4-4v3h10a4 4 0 0 0 4-4v-1h2z" /></svg>
        </button>
        <label class="tempo">
          <span>Tempo</span>
          <input id="tempo" type="range" min="20" max="300" step="1" value="96" disabled />
          <output id="tempo-value" for="tempo">96 BPM</output>
        </label>
      </footer>
      <div id="abcjs-audio" class="audio-host" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
