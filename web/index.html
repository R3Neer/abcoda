<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABCoda</title>
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <header class="score-header">
        <div>
          <div class="brand">ABCoda</div>
          <h1 id="score-title">Interactive score</h1>
        </div>
        <div class="header-actions">
          <button id="code-toggle" class="icon-button" type="button" title="View ABC code" aria-label="View ABC code" aria-pressed="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 5-4 5 4 5M13 5l4 5-4 5M11.5 3 8.5 17" /></svg>
          </button>
          <button id="fullscreen" class="icon-button" type="button" title="Open full screen" aria-label="Open full screen">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M17 13v4h-4M7 17H3v-4" /></svg>
          </button>
        </div>
      </header>

      <section id="notice" class="notice" role="status" hidden>
        <span id="notice-message"></span>
        <button id="notice-dismiss" class="notice-dismiss" type="button" title="Dismiss message" aria-label="Dismiss message">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" /></svg>
        </button>
      </section>
      <section id="score" class="score" aria-label="Musical score"></section>
      <section id="abc-panel" class="abc-panel" aria-label="ABC source editor" hidden>
        <textarea id="abc-source" aria-label="ABC source code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <div class="abc-actions">
          <button id="abc-copy" type="button">Copy</button>
          <button id="abc-reset" type="button">Restore original</button>
          <button id="abc-apply" class="primary" type="button">Apply changes</button>
        </div>
      </section>
      <div id="abcjs-audio" class="abcjs-audio-host" hidden></div>

      <aside class="control-dock" aria-label="Score controls">
        <section class="transport" aria-label="Playback controls">
          <div class="transport-buttons">
            <button id="playback-toggle" class="primary" type="button" aria-label="Play" aria-pressed="false" disabled>
              <span id="playback-icon" class="control-icon playback-glyph" data-state="play" aria-hidden="true">
                <svg class="play-glyph" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" /></svg>
                <svg class="pause-glyph" viewBox="0 0 16 16"><rect x="3" y="2.5" width="3.5" height="11" rx="1" /><rect x="9.5" y="2.5" width="3.5" height="11" rx="1" /></svg>
                <span class="loading-glyph">…</span>
              </span>
              <span id="playback-label">Play</span>
            </button>
            <button id="rewind" type="button" aria-label="Return to beginning" title="Return to beginning" disabled><span class="control-icon rewind-icon" aria-hidden="true">|◀</span><span>Beginning</span></button>
            <button id="loop" type="button" aria-label="Loop" aria-pressed="false"><span class="control-icon" aria-hidden="true">↻</span><span>Loop</span></button>
          </div>
          <label class="tempo-control" for="tempo">
            <span>Tempo</span>
            <input id="tempo" type="range" min="20" max="300" value="96" />
            <output id="tempo-output" for="tempo">96 BPM</output>
          </label>
        </section>

        <details id="mixer" class="mixer">
          <summary>Voices and instruments</summary>
          <div id="voice-controls" class="voice-controls"></div>
        </details>
      </aside>

      <section class="transpose-control" aria-label="Transpose score">
        <span>Transpose</span>
        <button id="transpose-down" type="button" title="Down one semitone" aria-label="Transpose down one semitone">−</button>
        <output id="transpose-output" aria-live="polite">Original</output>
        <button id="transpose-up" type="button" title="Up one semitone" aria-label="Transpose up one semitone">+</button>
        <button id="transpose-reset" type="button" disabled>Reset</button>
      </section>

      <button id="sample-credits" class="credits" type="button">FluidR3_GM samples · CC BY 3.0</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
